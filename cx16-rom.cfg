# cx16-rom.cfg - ROM linker config for UniLib
#
# Three ROM banks + RAM bank 1 BSS + relocated ZP (avoids BASIC conflict).
#
# Bank A ($10): Foundation + Data (memory, pools, lists, iterators, math, strings, core)
# Bank B ($11): Display (windows, VERA, font, string rendering)
# Bank C ($12): Font data (LZSA2 compressed)
#
# Each bank produces a 16KB binary ($C000-$FFFF).
# Banks A & B have KSUP bridge tables at $FEA8-$FFF9 and fillval for $FFFA-$FFFF.
# Bank C is pure data with fillval for unused space.

MEMORY {
    # Zero page: user area $22-$5F for general ZP (if needed by cc65 headers)
    ZP:       file = "",                start = $0022, size = $003E;

    # Extended zero page: $60-$7F for UniLib EXTZP variables (19 bytes used)
    # Relocated from $DA (RAM build) to avoid BASIC ZPBASIC ($D4-$FE) conflict
    ZPEXT:    file = "",                start = $0060, size = $0020, define = yes;

    # Bank A: code/rodata/data at $C000-$FEA7, KSUP vectors at $FEA8-$FFFF
    ROMA:     file = "unilib_b0.bin",   start = $C000, size = $3EA8, fill = yes, fillval = $AA;
    ROMA_VEC: file = "unilib_b0.bin",   start = $FEA8, size = $0158, fill = yes, fillval = $AA;

    # Bank B: code/rodata/data at $C000-$FEA7, KSUP vectors at $FEA8-$FFFF
    ROMB:     file = "unilib_b1.bin",   start = $C000, size = $3EA8, fill = yes, fillval = $AA;
    ROMB_VEC: file = "unilib_b1.bin",   start = $FEA8, size = $0158, fill = yes, fillval = $AA;

    # Bank C: compressed font data only, no executable code
    ROMC:     file = "unilib_b2.bin",   start = $C000, size = $4000, fill = yes, fillval = $AA;

    # BSS in non-banked low RAM ($0400-$05FF, 512 bytes)
    # Must NOT be in banked RAM — BSS is accessed while various RAM banks are active
    RAMBSS:   file = "",                start = $0400, size = $0200;
}

SEGMENTS {
    ZEROPAGE:       load = ZP,       type = zp;
    EXTZP:          load = ZPEXT,    type = zp,  define = yes;

    BANK_A_CODE:    load = ROMA,     type = ro;
    BANK_A_RODATA:  load = ROMA,     type = ro;
    BANK_A_DATA:    load = ROMA,     type = ro;
    BANK_A_VEC:     load = ROMA_VEC, type = ro;

    BANK_B_CODE:    load = ROMB,     type = ro;
    BANK_B_RODATA:  load = ROMB,     type = ro;
    BANK_B_DATA:    load = ROMB,     type = ro;
    BANK_B_VEC:     load = ROMB_VEC, type = ro;

    BANK_C_DATA:    load = ROMC,     type = ro;

    BSS:            load = RAMBSS,   type = bss, define = yes;
}
